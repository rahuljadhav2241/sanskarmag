version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sanskarmag-app
    restart: unless-stopped
    ports:
      # If your VPS has Nginx installed on the host, bind to localhost:
      - "127.0.0.1:3000:3000"
      # If you want it directly accessible on public port 3000, use:
      # - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
